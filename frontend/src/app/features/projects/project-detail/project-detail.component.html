<section class="page detail-page">
  <a routerLink="/projects" class="back-link">← Back to projects</a>

  @if (project$ | async; as project) {
    <article class="glass-card detail">
      <span class="badge">{{ project.status }}</span>
      <h1>{{ project.title }}</h1>
      <p class="summary">{{ project.summary }}</p>
      <div class="question">
        <p>Research question</p>
        <h2>{{ project.research_question }}</h2>
      </div>
      <div class="tags">
        @for (tag of project.tags; track tag) { <span>{{ tag }}</span> }
      </div>
      <small>Created {{ project.created_at | date:'medium' }}</small>
    </article>
  }
</section>
