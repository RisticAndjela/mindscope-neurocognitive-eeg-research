[project]
name = "mindscope-backend"
version = "0.1.0"
description = "FastAPI backend for MindScope blog and research tracking."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "sqlalchemy[asyncio]==2.0.36",
  "asyncpg==0.30.0",
  "pydantic==2.10.4",
  "pydantic-settings==2.7.0",
  "python-slugify==8.0.4",
  "python-multipart==0.0.20",
  "PyJWT==2.10.1",
  "cryptography==43.0.3",
]

[tool.ruff]
line-length = 100
